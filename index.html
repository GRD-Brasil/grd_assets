<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRD Brasil - Assets Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #09090b; color: #fff; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.25rem;
        }
        .asset-card {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 0.75rem;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .asset-card:hover {
            border-color: #f97316;
            box-shadow: 0 0 15px rgba(249,115,22,0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-5 relative overflow-x-hidden">
    
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-orange-500/10 blur-[100px] pointer-events-none rounded-full"></div>

    <div class="z-10 w-full max-w-6xl flex flex-col gap-8">
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-4xl font-extrabold tracking-widest uppercase text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-600 drop-shadow-[0_0_10px_rgba(249,115,22,0.3)]">
                GRD Brasil Assets
            </h1>
            <p class="text-zinc-400 mt-2 font-medium">Official Repository of Images and Media</p>
        </div>

        <!-- Barra de Pesquisa -->
        <div class="w-full flex justify-center mb-4">
            <input type="text" id="searchInput" placeholder="Search by image or folder name..." class="w-full max-w-xl bg-zinc-900 border border-zinc-700 text-white rounded-xl px-4 py-3 outline-none focus:border-orange-500 transition-colors shadow-inner" />
        </div>

        <!-- Galeria -->
        <div id="gallery" class="gallery-grid w-full">
            <div class="col-span-full text-center text-zinc-500 py-10 animate-pulse">Loading assets...</div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-orange-500 text-white px-5 py-3 rounded-lg font-bold shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        Path copied!
    </div>

    <script>
        let allAssets = [];

        // Função para extrair arquivos recursivamente do formato de árvore
        function extractFiles(node) {
            let files = [];
            if (node.type === 'file') {
                files.push(node);
            } else if (node.children) {
                node.children.forEach(child => {
                    files = files.concat(extractFiles(child));
                });
            }
            return files;
        }

        async function initGallery() {
            try {
                const response = await fetch('./manifest.json');
                const data = await response.json();
                
                // O JSON tem uma propriedade "root" que é um array
                if (data.root && Array.isArray(data.root)) {
                    data.root.forEach(node => {
                        allAssets = allAssets.concat(extractFiles(node));
                    });
                }

                // Remove scripts python e json da lista de galeria
                allAssets = allAssets.filter(a => !a.name.endsWith('.py') && !a.name.endsWith('.json') && !a.name.endsWith('.html'));

                renderGallery(allAssets);
            } catch (error) {
                document.getElementById('gallery').innerHTML = `<div class="col-span-full text-center text-red-500">Error loading manifest.json</div>`;
                console.error("Error loading manifest:", error);
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.style.transform = 'translateY(0)';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.transform = 'translateY(20px)';
                toast.style.opacity = '0';
            }, 2000);
        }

        function renderGallery(assets) {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            if(assets.length === 0) {
                gallery.innerHTML = `<div class="col-span-full text-center text-zinc-500 py-10">No images found.</div>`;
                return;
            }

            assets.forEach(asset => {
                const card = document.createElement('div');
                card.className = 'asset-card flex flex-col cursor-pointer group relative';
                card.title = "Click to copy path";
                card.onclick = () => {
                    navigator.clipboard.writeText(asset.path);
                    showToast();
                };

                // Tratar se for vídeo ou imagem (baseado na extensão)
                let mediaHtml = '';
                const ext = asset.name.split('.').pop().toLowerCase();
                
                if (['mp4', 'webm', 'ogg'].includes(ext)) {
                    mediaHtml = `<video src="${asset.path}" class="w-full h-36 object-contain bg-black/50 p-2" autoplay loop muted playsinline></video>`;
                } else if (['svg'].includes(ext)) {
                    mediaHtml = `<img src="${asset.path}" alt="${asset.name}" loading="lazy" class="w-full h-36 object-contain p-4 bg-black/20" />`;
                } else {
                    mediaHtml = `<img src="${asset.path}" alt="${asset.name}" loading="lazy" class="w-full h-36 object-cover" />`;
                }

                // Caminho resumido
                const pathParts = asset.path.split('/');
                const parentFolder = pathParts.length > 2 ? pathParts[pathParts.length - 2] : '';

                card.innerHTML = `
                    ${mediaHtml}
                    <div class="p-3 flex flex-col gap-0.5 border-t border-white/5 bg-zinc-900/50 flex-1 justify-end">
                        <span class="text-xs font-bold text-white truncate" title="${asset.name}">${asset.name}</span>
                        <span class="text-[10px] text-zinc-500 font-mono truncate">${parentFolder}</span>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        // Pesquisa
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allAssets.filter(asset => asset.name.toLowerCase().includes(term) || asset.path.toLowerCase().includes(term));
            renderGallery(filtered);
        });

        initGallery();
    </script>
</body>
</html>
